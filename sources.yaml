# ══════════════════════════════════════════════════════════════════════
# JIC — Curated Source Manifest
#
# Run `helper-scripts/fetch-source-data.sh` (host) or
# `docker compose --profile fetch run --rm content-fetch` (container)
# to download these into the content library.  All items listed here are
# public-domain, Creative Commons, or explicitly free for redistribution.
#
# Profiles:
#   • core            Curated emergency PDFs (~350 MB)
#   • emergency-zims  High-value offline Kiwix emergency/medical ZIMs (~20 GB)
#   • full-zims       Full encyclopedia ZIMs (Wikipedia, Gutenberg, WikiHow ~240 GB)
#   • kalite          KA-Lite educational video/thumbnail pack (~40 GB)
#
# Format:
#   - url:      Direct download link (.pdf, .txt, .zim, or .torrent)
#     filename: Target filename inside <library>/<category>/
#     category: Subfolder (100_Survival, 200_Medical, Zims, Videos...)
#     title:    Human-readable name
#     profile:  (optional) core | emergency-zims | full-zims | kalite (default: core)
#     license:  License / redistribution basis
#     size:     Approximate download size
#     sha256:   (optional) SHA-256 hash for integrity verification
#
# Validate after editing:  helper-scripts/fetch-source-data.sh --validate
# ══════════════════════════════════════════════════════════════════════

