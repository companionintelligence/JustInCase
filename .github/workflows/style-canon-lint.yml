name: Style canon lint

# Restored 2026-09-10 (was gated to workflow_dispatch-only in the August 2026
# org-wide cost pass). Found during an org-level CI/CD health audit.
on: [pull_request, push]

jobs:
  style-canon-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@companionintelligence'
      # No npm project here: the gate is the ci-lint-canon bin of @companionintelligence/config,
      # pointed at the vendored canon (brand bundle) so it needs no tokens install.
      - run: npx --yes --package @companionintelligence/config ci-lint-canon . --tokens public/assets/brand/tokens/tokens.json
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: scripts/vendor-brand.sh --check
