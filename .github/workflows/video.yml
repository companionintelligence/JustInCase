# Product video — capture the real UI, then render both cuts.
#
# Deliberately NO `push` trigger. CI-Local-CICD's policy gates always-on
# workflows (its README: "CI-Marketplace was fully gated and billing again
# within a day"), so this runs on demand and once a week.
name: Product video

on:
  workflow_dispatch:
    inputs:
      render:
        description: Also render the MP4s (slower)
        type: boolean
        default: true
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

concurrency:
  group: video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          # Without a scope, setup-node writes a bare `registry=` into ~/.npmrc
          # and every package — playwright included — routes to GitHub Packages
          # and 404s. Scope it so only @companionintelligence/* goes there.
          scope: "@companionintelligence"

      # @companionintelligence/video-kit is published to GitHub Packages from
      # CI-Common. `secrets.GITHUB_TOKEN` is scoped to THIS repository, so it can
      # only read that package if the package grants JustInCase read access:
      #
      #   CI-Common → Packages → video-kit → Package settings
      #     → Manage Actions access → Add repository → JustInCase (role: Read)
      #
      # Without that grant this step dies in ~13 seconds with
      #   403 Forbidden - GET .../@companionintelligence%2fvideo-kit
      #   Permission permission_denied: read_package
      # and no capture ever runs — which is how every shot below ended up
      # rendering as a "capture pending" slate. The grant is a package setting
      # and cannot be made from a workflow file. Do not route around it with a
      # long-lived PAT.
      - name: Install video project
        working-directory: video
        run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Chromium
        working-directory: video
        run: npx playwright install --with-deps chromium

      # JIC's UI is static: src/server.cpp does set_mount_point("/", "public")
      # and adds three JSON endpoints (/status, /api/library, /query). Those are
      # stubbed from committed fixtures in video/capture.config.mjs, so the
      # capture stage is just a static file server over public/.
      #
      # tests/container/playwright.config.ts deliberately has no `webServer`
      # (it targets an already-running container), so there is no existing boot
      # step to reuse. The real container is not usable here: the Dockerfile
      # compiles llama.cpp and MuPDF from source and the server needs ~2.3 GB of
      # host-provisioned GGUF weights, and its answers are non-deterministic —
      # which would make every capture a false UI-drift diff.
      - name: Start app
        run: |
          # Detach from the step's stdout, or the runner waits on the pipe.
          nohup python3 -m http.server 8080 --directory public \
            > /tmp/jic-stage.log 2>&1 &
          echo $! > /tmp/jic-stage.pid
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:8080/ && break
            sleep 1
          done
          curl -fsS -o /dev/null http://localhost:8080/
          echo "stage up on http://localhost:8080 (static public/)"

      - name: Capture
        working-directory: video
        run: npm run capture

      # A shot with no PNG renders as a branded "capture pending" slate
      # (video-kit src/scenes.mjs shotSrc), and `ci-video build` only prints a
      # note about it. Two gates now stand between that slate and a shipped
      # video, and this is the FIRST of them:
      #
      #   · `ci-video capture` exits 1 if any single shot failed
      #     (bin/ci-video.mjs cmdCapture) — that is the step above.
      #   · `ci-video check` exits 1 if any shot file is missing or empty,
      #     unless --allow-slates is passed — that is "Build and check" below.
      #     Never add --allow-slates here; it exists for local drafting.
      #
      # So this step is deliberately a duplicate of the second gate, pulled
      # forward: it fires before `build` so a bad capture is reported next to
      # the capture that produced it, and it emits a per-file `::error file=`
      # annotation, which `ci-video check` does not.
      #
      # It calls video-kit's own `missingShots()` rather than re-deriving the
      # filenames. An earlier hand-rolled version checked only os.path.exists,
      # so a 0-byte PNG passed this gate and still rendered as a slate — both
      # video-kit code paths that choose slate-vs-real require size > 0
      # (build.mjs hasShot, capture.mjs missingShots). Use the helper.
      - name: Every shot must be captured
        working-directory: video
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import { missingShots } from "@companionintelligence/video-kit/capture";

            const sb = JSON.parse(fs.readFileSync("storyboard.json", "utf8"));
            const missing = missingShots(sb, process.cwd());
            // Shot ids are unique across the storyboard; capture writes
            // <id>.png (16:9) and <id>.mobile.png (9:16) for each.
            const ids = new Set(sb.scenes.flatMap((s) => s.shots ?? []).map((s) => s.id));
            const total = ids.size * 2;

            for (const f of missing) {
              console.log(`::error file=video/assets/shots/${f}::missing or empty — renders as a "capture pending" slate`);
            }
            if (missing.length) {
              console.log(`::error::${missing.length} of ${total} shot PNGs missing or empty; refusing to ship a video with slates in it`);
              process.exit(1);
            }
            console.log(`all ${total} shot PNGs present and non-empty`);
          '

      - name: Stop app
        if: always()
        run: |
          [ -f /tmp/jic-stage.pid ] && kill "$(cat /tmp/jic-stage.pid)" || true

      # Shots are byte-stable, so a diff here means the UI genuinely changed.
      # Surface it as a PR rather than silently committing to the branch.
      - name: Detect UI drift
        id: drift
        working-directory: video
        run: |
          if [ -n "$(git status --porcelain assets/shots)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --porcelain assets/shots
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and check
        working-directory: video
        run: npm run build && npm run check

      # The ubuntu-latest (24.04) runner image does NOT ship FFmpeg, and
      # `npm run render` needs both binaries: ffmpeg to encode the MP4 and
      # ffprobe to probe the media assets. Without this step the render aborts
      # with "FFmpeg not found / FFprobe not found" and no MP4 is ever produced,
      # even though every shot captured cleanly. Do not delete this as
      # redundant — nothing else in this workflow installs it.
      #
      # Guarded by the same condition as Render below so a capture-only run
      # (render=false) does not pay for the apt install.
      - name: Install FFmpeg
        if: ${{ github.event_name == 'schedule' || inputs.render }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Render
        if: ${{ github.event_name == 'schedule' || inputs.render }}
        working-directory: video
        run: npm run render

      - uses: actions/upload-artifact@v4
        with:
          name: ci-just-in-case-video
          path: |
            video/out/*.mp4
            video/assets/shots/*.png
          if-no-files-found: warn

      - name: Open a PR when the UI drifted
        if: steps.drift.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/video-shot-refresh
          title: "chore(video): refresh Just In Case product-video captures"
          body: |
            The scheduled capture produced different screenshots, which means the UI changed.

            Review the image diff, update `video/storyboard.json` captions if a screen's meaning
            changed, then merge to re-render the product video from the current UI.
          add-paths: video/assets/shots
          commit-message: "chore(video): refresh product-video captures"
